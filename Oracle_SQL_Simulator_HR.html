<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle SQL Simulator - HR Schema</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;
    --text:#c9d1d9;--text-muted:#8b949e;--accent:#58a6ff;
    --green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;
    --editor-bg:#0d1117;--grid-header:#1c2333;--grid-row1:#161b22;--grid-row2:#0d1117;
    --editor-color:#e6edf3;--hover-row:rgba(56,139,253,.06);
    --selection-bg:rgba(56,139,253,.3);--accent-hover:#79c0ff;
    --sql-keyword:#569cd6;--sql-function:#dcdcaa;--sql-string:#ce9178;
    --sql-number:#b5cea8;--sql-comment:#6a9955;
    --row-selected:rgba(56,139,253,.15)
  }
  [data-theme="light"]{
    --bg:#f6f8fa;--surface:#ffffff;--surface2:#f0f2f5;--border:#d0d7de;
    --text:#1f2328;--text-muted:#656d76;--accent:#0969da;
    --green:#1a7f37;--red:#d1242f;--yellow:#9a6700;--purple:#8250df;
    --editor-bg:#ffffff;--grid-header:#f0f2f5;--grid-row1:#ffffff;--grid-row2:#f6f8fa;
    --editor-color:#1f2328;--hover-row:rgba(9,105,218,.04);
    --selection-bg:rgba(9,105,218,.15);--accent-hover:#0550ae;
    --sql-keyword:#0000ff;--sql-function:#795e26;--sql-string:#a31515;
    --sql-number:#098658;--sql-comment:#008000;
    --row-selected:rgba(9,105,218,.12)
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .header-left{display:flex;align-items:center;gap:12px}
  .logo{font-size:18px;font-weight:700;color:var(--accent)}
  .logo span{color:var(--text-muted);font-weight:400;font-size:13px;margin-left:6px}
  .header-right{display:flex;align-items:center;gap:10px}
  .schema-select{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer}
  .theme-toggle{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;gap:5px;transition:all .15s}
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .theme-toggle svg{width:16px;height:16px;flex-shrink:0}
  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .sidebar-resizer{width:4px;cursor:col-resize;background:var(--border);flex-shrink:0;transition:background .15s;position:relative;z-index:5}
  .sidebar-resizer:hover,.sidebar-resizer.active{background:var(--accent)}
  .sidebar-section{border-bottom:1px solid var(--border)}
  .sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
  .sidebar-header h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600}
  .sidebar-header .arrow{color:var(--text-muted);font-size:10px;transition:transform .2s}
  .sidebar-header .arrow.open{transform:rotate(180deg)}
  .sidebar-body{padding:4px 8px 8px;overflow-y:auto}
  .table-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text);transition:background .15s}
  .table-item:hover{background:var(--surface2)}
  .table-item .t-icon{color:var(--yellow);font-size:11px;flex-shrink:0}
  .table-item .t-name{font-weight:600;color:var(--accent)}
  .table-item .t-count{color:var(--text-muted);margin-left:auto;font-size:10px}
  .col-list{padding:2px 0 4px 28px}
  .col-item{padding:3px 10px;font-size:11px;color:var(--text-muted);border-radius:3px;cursor:pointer}
  .col-item:hover{color:var(--text);background:var(--surface2)}
  .col-item .col-pk{color:var(--yellow);margin-right:4px}
  .col-item .col-fk{color:var(--green);margin-right:4px}
  .saved-list{padding:4px 8px 8px;overflow-y:auto}
  .saved-item{display:flex;align-items:center;gap:6px;padding:6px 10px;margin-bottom:3px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--text);transition:background .15s;border:1px solid transparent;line-height:1.4}
  .saved-item:hover{background:var(--surface2);border-color:var(--border)}
  .saved-item .sq-name{color:var(--accent);font-weight:600;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .saved-item .sq-delete{color:var(--text-muted);font-size:13px;cursor:pointer;flex-shrink:0;padding:0 2px;border:none;background:none;line-height:1}
  .saved-item .sq-delete:hover{color:var(--red)}
  .saved-item .sq-sql{color:var(--text-muted);font-family:'Cascadia Code','Fira Code',monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
  .saved-empty{padding:12px 10px;font-size:11px;color:var(--text-muted);text-align:center}
  .editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .editor-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
  .btn-run{background:#238636;color:#fff}
  .btn-run:hover{background:#2ea043}
  .btn-run.running{opacity:.7;pointer-events:none}
  .btn-clear{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
  .btn-clear:hover{color:var(--text);border-color:var(--text-muted)}
  .btn-format{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
  .btn-format:hover{color:var(--text);border-color:var(--text-muted)}
  .btn-save{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
  .btn-save:hover{color:var(--accent);border-color:var(--accent)}
  .exec-time{margin-left:auto;font-size:11px;color:var(--text-muted);font-family:monospace}
  .font-size-group{display:flex;align-items:center;gap:4px;margin-left:4px}
  .font-size-label{font-size:11px;color:var(--text-muted);white-space:nowrap}
  .font-size-select{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:4px 6px;border-radius:4px;font-size:11px;cursor:pointer;outline:none}
  .font-size-select:focus{border-color:var(--accent)}
  .editor-wrap{flex:1;display:flex;position:relative;overflow:hidden;min-height:180px}
  .editor-line-numbers{width:44px;background:var(--surface);padding:12px 0;text-align:right;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;color:var(--text-muted);overflow:hidden;user-select:none;flex-shrink:0;border-right:1px solid var(--border)}
  .editor-line-numbers div{padding-right:10px}
  .sql-editor{flex:1;background:var(--editor-bg);color:transparent;border:none;outline:none;resize:none;padding:12px 16px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;tab-size:2;overflow-y:auto;white-space:pre;overflow-wrap:normal;caret-color:var(--editor-color);position:relative;z-index:2}
  .sql-editor::selection{background:var(--selection-bg);color:transparent}
  .sql-editor::placeholder{color:var(--text-muted)}
  .sql-highlight-layer{position:absolute;top:0;left:0;right:0;bottom:0;padding:12px 16px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;tab-size:2;overflow-y:auto;white-space:pre;overflow-wrap:normal;pointer-events:none;z-index:1;color:var(--editor-color);background:transparent;border:none;margin:0}
  .sql-highlight-layer code{font-family:inherit;font-size:inherit;line-height:inherit;tab-size:inherit}
  .resizer{height:5px;background:var(--border);cursor:row-resize;flex-shrink:0;transition:background .15s}
  .resizer:hover,.resizer.active{background:var(--accent)}
  .error-bar{display:none;padding:8px 16px;background:rgba(248,81,73,.1);border-bottom:1px solid var(--red);color:var(--red);font-size:12px;font-family:monospace;flex-shrink:0;align-items:center;gap:8px}
  .error-bar.show{display:flex}
  .results-area{flex:1;overflow:auto;display:flex;flex-direction:column}
  .results-info{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;font-size:11px;color:var(--text-muted)}
  .results-info .ri-count{color:var(--green);font-weight:600}
  .results-grid{flex:1;overflow:auto;padding:0}
  .results-table{border-collapse:collapse;font-size:12px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;table-layout:fixed}
  .results-table thead{position:sticky;top:0;z-index:10}
  .results-table th{background:var(--grid-header);color:var(--accent);padding:8px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--border);white-space:nowrap;position:relative;user-select:none;overflow:hidden}
  .results-table th:hover{color:var(--accent-hover)}
  .results-table th .th-content{display:flex;align-items:center;gap:4px;cursor:grab;min-width:0}
  .results-table th .th-content:active{cursor:grabbing}
  .results-table th .sort-icon{margin-left:auto;font-size:9px;opacity:.5;flex-shrink:0}
  .results-table th.sorted .sort-icon{opacity:1;color:var(--accent)}
  .results-table th .col-resize-handle{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
  .results-table th .col-resize-handle:hover,.results-table th .col-resize-handle.active{background:var(--accent);opacity:.5}
  .results-table td{padding:6px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
  .results-table tr:nth-child(odd) td{background:var(--grid-row1)}
  .results-table tr:nth-child(even) td{background:var(--grid-row2)}
  .results-table tr:hover td{background:var(--hover-row)}
  .results-table tr.row-selected td{background:var(--row-selected) !important}
  .results-table td.null-val{color:var(--text-muted);font-style:italic}
  .results-table td.number-val{color:var(--green);text-align:right}
  .results-table th.drag-over-left{box-shadow:inset 3px 0 0 var(--accent)}
  .results-table th.drag-over-right{box-shadow:inset -3px 0 0 var(--accent)}
  .results-table th.dragging{opacity:.4}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:12px;padding:40px}
  .empty-state .es-icon{font-size:48px;opacity:.3}
  .empty-state .es-title{font-size:16px;font-weight:600;color:var(--text)}
  .empty-state .es-desc{font-size:13px;text-align:center;max-width:400px;line-height:1.6}
  kbd{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10px;font-family:monospace;color:var(--text-muted)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);flex-shrink:0}
  .statusbar .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;display:inline-block}
  @media(max-width:768px){
    .sidebar{display:none}
    .sidebar-resizer{display:none}
    .main{flex-direction:column}
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="logo">Oracle SQL Simulator</div>
  </div>
  <div class="header-right">
    <select class="schema-select" id="schemaSelect">
      <option value="hr">HR Schema</option>
    </select>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
      <svg id="themeIconDark" viewBox="0 0 20 20" fill="currentColor" style="display:none"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
      <svg id="themeIconLight" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
    </button>
  </div>
</div>
<div class="main">
  <div class="sidebar" id="sidebar" style="width:260px">
    <div class="sidebar-section">
      <div class="sidebar-header" onclick="toggleSection('tables')">
        <h3>Tables</h3>
        <span class="arrow open" id="tablesArrow">&#9660;</span>
      </div>
      <div class="sidebar-body" id="tablesBody"></div>
    </div>
    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="sidebar-header" onclick="toggleSection('saved')">
        <h3>Query History</h3>
        <span class="arrow open" id="savedArrow">&#9660;</span>
      </div>
      <div class="saved-list" id="savedBody" style="flex:1;overflow-y:auto"></div>
    </div>
  </div>
  <div class="sidebar-resizer" id="sidebarResizer"></div>
  <div class="editor-area">
    <div class="editor-toolbar">
      <button class="btn btn-run" id="runBtn" onclick="executeQuery()">&#9654; Run</button>
      <button class="btn btn-clear" onclick="clearEditor()">&#10005; Clear</button>
      <button class="btn btn-format" onclick="formatQuery()">&#8677; Format</button>
      <button class="btn btn-save" onclick="saveQuery()">&#128190; Save</button>
      <div class="font-size-group">
        <span class="font-size-label">Font:</span>
        <select class="font-size-select" id="fontSizeSelect" onchange="changeEditorFontSize(this.value)">
          <option value="12">12px</option>
          <option value="13" selected>13px</option>
          <option value="14">14px</option>
          <option value="16">16px</option>
          <option value="18">18px</option>
          <option value="20">20px</option>
        </select>
      </div>
      <span style="font-size:11px;color:var(--text-muted)"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
      <span class="exec-time" id="execTime"></span>
    </div>
    <div class="editor-wrap" id="editorWrap">
      <div class="editor-line-numbers" id="lineNumbers"><div>1</div></div>
      <div style="flex:1;position:relative;overflow:hidden">
        <pre class="sql-highlight-layer" id="sqlHighlight"><code id="sqlHighlightCode"></code></pre>
        <textarea class="sql-editor" id="sqlEditor" placeholder="Write your SQL query here...&#10;&#10;Example: SELECT * FROM employees" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="error-bar" id="errorBar">
      <span>&#9888;</span>
      <span id="errorText"></span>
    </div>
    <div class="results-area" id="resultsArea">
      <div class="empty-state" id="emptyState">
        <div class="es-icon">&#128450;</div>
        <div class="es-title">No Results Yet</div>
        <div class="es-desc">Write a SQL query above and click <b>Run</b> or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd>.</div>
      </div>
      <div class="results-info" id="resultsInfo" style="display:none">
        <span>Rows: <span class="ri-count" id="rowCount">0</span></span>
        <span>Columns: <span id="colCount">0</span></span>
        <span id="sortInfo" style="margin-left:auto"></span>
      </div>
      <div class="results-grid" id="resultsGrid" style="display:none"></div>
    </div>
  </div>
</div>
<div class="statusbar">
  <span><span class="status-dot"></span>Ready</span>
  <span id="dbInfo"></span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/alasql/4.5.0/alasql.min.js"></script>

function initDB() {
  for (const [table, rows] of Object.entries(HR_DATA)) {
    try { alasql('DROP TABLE IF EXISTS ' + table); } catch(e) {}
    if (rows.length > 0) {
      const cols = Object.keys(rows[0]);
      const colDefs = cols.map(c => {
        const v = rows[0][c];
        let t = 'STRING';
        if (typeof v === 'number') t = 'INT';
        else if (v === null && rows.some(r => r[c] !== null && typeof r[c] === 'number')) t = 'INT';
        return c + ' ' + t;
      }).join(', ');
      alasql('CREATE TABLE ' + table + ' (' + colDefs + ')');
      for (const row of rows) {
        alasql('INSERT INTO ' + table + ' SELECT * FROM ?', [[row]]);
      }
    }
  }
  const info = Object.entries(HR_DATA).map(function(pair) { return pair[0] + '(' + pair[1].length + ')'; }).join(' | ');
  document.getElementById('dbInfo').textContent = info;
}

function buildSidebar() {
  var body = document.getElementById('tablesBody');
  var html = '';
  var tables = Object.keys(TABLE_META);
  for (var ti = 0; ti < tables.length; ti++) {
    var table = tables[ti];
    var meta = TABLE_META[table];
    var count = (HR_DATA[table] && HR_DATA[table].length) || 0;
    html += '<div class="table-item" onclick="toggleTable(\'' + table + '\', this)">';
    html += '<span class="t-icon">&#9638;</span>';
    html += '<span class="t-name">' + table + '</span>';
    html += '<span class="t-count">' + count + '</span>';
    html += '</div>';
    html += '<div class="col-list" id="cols_' + table + '" style="display:none">';
    for (var ci = 0; ci < meta.columns.length; ci++) {
      var c = meta.columns[ci];
      var badge = '';
      if (c === meta.pk) badge = '<span class="col-pk">PK</span>';
      else if (meta.fks[c]) badge = '<span class="col-fk">FK</span>';
      html += '<div class="col-item" onclick="insertColumn(\'' + table + '\',\'' + c + '\')">' + badge + c + '</div>';
    }
    html += '</div>';
  }
  body.innerHTML = html;
}

function toggleTable(table, el) {
  var cols = document.getElementById('cols_' + table);
  if (cols.style.display === 'none') { cols.style.display = 'block'; }
  else { cols.style.display = 'none'; }
}

function toggleSection(id) {
  var body = document.getElementById(id + 'Body');
  var arrow = document.getElementById(id + 'Arrow');
  if (body.style.display === 'none') {
    body.style.display = 'block';
    arrow.classList.add('open');
  } else {
    body.style.display = 'none';
    arrow.classList.remove('open');
  }
}

function insertColumn(table, column) {
  var ed = document.getElementById('sqlEditor');
  var pos = ed.selectionStart;
  var text = ed.value;
  var insert = table + '.' + column;
  ed.value = text.substring(0, pos) + insert + text.substring(pos);
  ed.focus();
  ed.setSelectionRange(pos + insert.length, pos + insert.length);
  updateLineNumbers();
  updateHighlight();
}

// SAVED QUERIES (Query History)
// ============================================================
var SAVED_KEY = 'sql-sim-saved-queries';

function getSavedQueries() {
  try {
    return JSON.parse(localStorage.getItem(SAVED_KEY)) || [];
  } catch(e) { return []; }
}

function saveQuery() {
  var ed = document.getElementById('sqlEditor');
  var sql = ed.value.trim();
  if (!sql) return;

  // Download as .sql file
  var now = new Date();
  var ts = now.getFullYear().toString() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0') + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0') +
    String(now.getSeconds()).padStart(2,'0');
  var filename = 'query_' + ts + '.sql';
  var blob = new Blob([sql], { type: 'text/sql;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function addQueryToHistory(sql) {
  var trimmed = sql.trim();
  if (!trimmed) return;

  var saved = getSavedQueries();

  // Check for duplicates - remove existing one if found
  var existingIdx = -1;
  for (var i = 0; i < saved.length; i++) {
    if (saved[i].sql === trimmed) {
      existingIdx = i;
      break;
    }
  }

  // Remove duplicate if exists
  if (existingIdx >= 0) {
    saved.splice(existingIdx, 1);
  }

  // Generate name
  var name = '';
  var match = trimmed.match(/SELECT\s+(?:DISTINCT\s+)?(.+?)\s+FROM/i);
  if (match) {
    name = match[1].replace(/\s+/g,' ').substring(0, 40);
  } else {
    name = trimmed.substring(0, 40).replace(/\n/g,' ');
  }

  // Add at the beginning (most recent first)
  saved.unshift({ id: Date.now(), name: name, sql: trimmed, date: new Date().toLocaleDateString() });

  // Limit to 100 items
  if (saved.length > 100) {
    saved = saved.slice(0, 100);
  }

  localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
  renderSavedQueries();
}

function deleteSavedQuery(id) {
  var saved = getSavedQueries();
  saved = saved.filter(function(q) { return q.id !== id; });
  localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
  renderSavedQueries();
}

function loadSavedQuery(id) {
  var saved = getSavedQueries();
  var q = saved.find(function(q) { return q.id === id; });
  if (q) {
    document.getElementById('sqlEditor').value = q.sql;
    updateLineNumbers();
    updateHighlight();
  }
}

function renderSavedQueries() {
  var body = document.getElementById('savedBody');
  var saved = getSavedQueries();
  if (saved.length === 0) {
    body.innerHTML = '<div class="saved-empty">No query history yet</div>';
    return;
  }
  var html = '';
  // saved is already ordered most-recent first
  for (var i = 0; i < saved.length; i++) {
    var q = saved[i];
    var sqlPreview = q.sql.replace(/\n/g,' ').substring(0, 50);
    html += '<div class="saved-item" onclick="loadSavedQuery(' + q.id + ')">';
    html += '<div style="width:100%;overflow:hidden">';
    html += '<div class="sq-name">' + q.name + '</div>';
    html += '<div class="sq-sql">' + sqlPreview + (q.sql.length > 50 ? '...' : '') + '</div>';
    html += '</div>';
    html += '<span class="sq-delete" onclick="event.stopPropagation();deleteSavedQuery(' + q.id + ')" title="Delete">&#10005;</span>';
    html += '</div>';
  }
  body.innerHTML = html;
}

    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeIconDark').style.display = '';
    document.getElementById('themeIconLight').style.display = 'none';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeIconDark').style.display = 'none';
    document.getElementById('themeIconLight').style.display = '';
  }
}

function toggleTheme() {
  var isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('sql-sim-theme', 'dark');
    document.getElementById('themeIconDark').style.display = 'none';
    document.getElementById('themeIconLight').style.display = '';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('sql-sim-theme', 'light');
    document.getElementById('themeIconDark').style.display = '';
    document.getElementById('themeIconLight').style.display = 'none';
  }
}

// SQL SYNTAX HIGHLIGHTING
// ============================================================
var SQL_KEYWORDS = [
  'SELECT','FROM','WHERE','JOIN','LEFT','RIGHT','INNER','FULL','OUTER',
  'ON','AND','OR','NOT','IN','BETWEEN','LIKE','IS','NULL','AS',
  'ORDER','BY','GROUP','HAVING','DISTINCT','INSERT','UPDATE','DELETE',
  'CREATE','DROP','TABLE','INTO','VALUES','SET','LIMIT','OFFSET',
  'UNION','ALL','EXISTS','CASE','WHEN','THEN','ELSE','END',
  'ASC','DESC','WITH','COUNT','SUM','AVG','MIN','MAX','ROUND'
];

var SQL_FUNCTIONS = [
  'COUNT','SUM','AVG','MIN','MAX','ROUND','COALESCE','NULLIF','CAST',
  'CONVERT','UPPER','LOWER','TRIM','SUBSTR','LENGTH','TO_DATE','TO_CHAR',
  'NVL','DECODE'
];

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightSQL(text) {
  var result = '';
  var i = 0;
  var len = text.length;

  // Build keyword regex pattern
  var kwPattern = new RegExp('\\b(' + SQL_KEYWORDS.join('|') + ')\\b', 'i');
  var funcPattern = new RegExp('\\b(' + SQL_FUNCTIONS.join('|') + ')\\b', 'i');

  while (i < len) {
    // Check for single-line comment --
    if (text[i] === '-' && i + 1 < len && text[i + 1] === '-') {
      var end = text.indexOf('\n', i);
      if (end === -1) end = len;
      result += '<span style="color:var(--sql-comment)">' + escapeHtml(text.substring(i, end)) + '</span>';
      i = end;
      continue;
    }

    // Check for multi-line comment /* */
    if (text[i] === '/' && i + 1 < len && text[i + 1] === '*') {
      var endC = text.indexOf('*/', i + 2);
      if (endC === -1) endC = len;
      else endC += 2;
      result += '<span style="color:var(--sql-comment)">' + escapeHtml(text.substring(i, endC)) + '</span>';
      i = endC;
      continue;
    }

    // Check for string literal (single quotes)
    if (text[i] === "'") {
      var j = i + 1;
      while (j < len) {
        if (text[j] === "'" && j + 1 < len && text[j + 1] === "'") {
          j += 2; // escaped quote
        } else if (text[j] === "'") {
          j++;
          break;
        } else {
          j++;
        }
      }
      result += '<span style="color:var(--sql-string)">' + escapeHtml(text.substring(i, j)) + '</span>';
      i = j;
      continue;
    }

    // Check for numbers
    if (/\d/.test(text[i]) && (i === 0 || /[\s,;=<>+\-*/(]/.test(text[i-1]))) {
      var numStart = i;
      while (i < len && /[\d.]/.test(text[i])) i++;
      // Check it's not part of an identifier (e.g. table name starting with digit)
      if (i < len && /[a-zA-Z_]/.test(text[i])) {
        // It's an identifier like 3M, backtrack
        i = numStart;
        result += escapeHtml(text[i]);
        i++;
        continue;
      }
      result += '<span style="color:var(--sql-number)">' + text.substring(numStart, i) + '</span>';
      continue;
    }

    // Check for word (identifier or keyword)
    if (/[a-zA-Z_]/.test(text[i])) {
      var wordStart = i;
      while (i < len && /[a-zA-Z0-9_]/.test(text[i])) i++;
      var word = text.substring(wordStart, i);

      // Check if it's a function (followed by '(')
      var lookAhead = i;
      while (lookAhead < len && text[lookAhead] === ' ') lookAhead++;
      var isFunc = lookAhead < len && text[lookAhead] === '(';

      if (isFunc && funcPattern.test(word)) {
        result += '<span style="color:var(--sql-function)">' + escapeHtml(word) + '</span>';
      } else if (kwPattern.test(word)) {
        result += '<span style="color:var(--sql-keyword)">' + escapeHtml(word) + '</span>';
      } else {
        result += escapeHtml(word);
      }
      continue;
    }

    // Default: pass through character
    result += escapeHtml(text[i]);
    i++;
  }

  return result;
}

function updateHighlight() {
  var code = document.getElementById('sqlHighlightCode');
  code.innerHTML = highlightSQL(editor.value) + '\n';
}

// ============================================================
// SQL EDITOR - Line numbers + shortcuts + highlighting
// ============================================================
var editor = document.getElementById('sqlEditor');
var lineNums = document.getElementById('lineNumbers');
var highlightLayer = document.getElementById('sqlHighlight');

function updateLineNumbers() {
  var lines = editor.value.split('\n').length;
  var html = '';
  for (var i = 1; i <= lines; i++) html += '<div>' + i + '</div>';
  lineNums.innerHTML = html;
}

editor.addEventListener('input', function() {
  updateLineNumbers();
  updateHighlight();
});
editor.addEventListener('scroll', function() {
  lineNums.scrollTop = editor.scrollTop;
  highlightLayer.scrollTop = editor.scrollTop;
  highlightLayer.scrollLeft = editor.scrollLeft;
});

editor.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    executeQuery();
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    var start = this.selectionStart;
    var end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
    updateLineNumbers();
    updateHighlight();
  }
});

// ============================================================
// CURSOR-BASED SQL STATEMENT DETECTION
// ============================================================
function getStatementAtCursor() {
  var text = editor.value;
  var selStart = editor.selectionStart;
  var selEnd = editor.selectionEnd;

  // If user has selected/highlighted text, execute only the selection
  if (selEnd > selStart) {
    return text.substring(selStart, selEnd).trim();
  }

  // Check if there's only one statement (no semicolons)
  var semicolonCount = (text.match(/;/g) || []).length;
  if (semicolonCount <= 1) {
    // Single statement or no semicolons - execute everything
    return text.trim();
  }

  // Multiple statements - find which one the cursor is in
  // Split by semicolons and track positions
  var statements = [];
  var lastPos = 0;
  for (var i = 0; i < text.length; i++) {
    if (text[i] === ';') {
      var stmt = text.substring(lastPos, i);
      statements.push({ text: stmt, start: lastPos, end: i });
      lastPos = i + 1;
    }
  }
  // Add any remaining text after last semicolon
  if (lastPos < text.length) {
    var remaining = text.substring(lastPos);
    if (remaining.trim().length > 0) {
      statements.push({ text: remaining, start: lastPos, end: text.length });
    }
  }

  if (statements.length === 0) return text.trim();

  // Find which statement contains the cursor
  var containingStmt = null;
  var nearestBefore = null;
  var nearestAfter = null;

  for (var j = 0; j < statements.length; j++) {
    var s = statements[j];
    if (selStart >= s.start && selStart <= s.end) {
      containingStmt = s;
      break;
    }
    // Track nearest statements for when cursor is between them
    if (s.end <= selStart) {
      nearestBefore = s;
    }
    if (s.start >= selStart && nearestAfter === null) {
      nearestAfter = s;
    }
  }

  var target;
  if (containingStmt) {
    target = containingStmt;
  } else if (nearestBefore) {
    // Cursor is after the semicolon of nearestBefore
    // Check if there's a nearestAfter and which is closer
    if (nearestAfter) {
      var distBefore = selStart - nearestBefore.end;
      var distAfter = nearestAfter.start - selStart;
      target = distBefore <= distAfter ? nearestBefore : nearestAfter;
    } else {
      target = nearestBefore;
    }
  } else if (nearestAfter) {
    target = nearestAfter;
  } else {
    // Fallback
    return text.trim();
  }

  var result = target.text.trim();
  if (!result) {
    // Empty statement at cursor - try the next non-empty one
    var idx = statements.indexOf(target);
    for (var k = idx + 1; k < statements.length; k++) {
      if (statements[k].text.trim()) {
        return statements[k].text.trim();
      }
    }
    for (var m = idx - 1; m >= 0; m--) {
      if (statements[m].text.trim()) {
        return statements[m].text.trim();
      }
    }
    return '';
  }
  return result;
}

// ============================================================
// EXECUTE QUERY
// ============================================================
function executeQuery() {
  var sql = getStatementAtCursor();
  if (!sql) return;

  hideError();
  var btn = document.getElementById('runBtn');
  var timeEl = document.getElementById('execTime');
  btn.classList.add('running');
  btn.innerHTML = '&#8987; Running...';
  timeEl.textContent = '';

  setTimeout(function() {
    try {
      var t0 = performance.now();
      var result = alasql(sql);
      var elapsed = (performance.now() - t0).toFixed(1);
      timeEl.textContent = elapsed + ' ms';

      if (Array.isArray(result)) {
        if (result.length > 0 && typeof result[0] === 'object' && result[0] !== null) {
          currentResult = result;
          sortCol = null;
          sortDir = 'asc';
          selectedRow = null;
          renderResult(result);
          // Auto-add to query history on success
          addQueryToHistory(sql);
        } else {
          // Array of primitives or empty array
          currentResult = null;
          showScalarResult(result);
          // Empty array results still count as success
          addQueryToHistory(sql);
        }
      } else if (typeof result === 'object' && result !== null) {
        currentResult = [result];
        sortCol = null;
        sortDir = 'asc';
        selectedRow = null;
        renderResult([result]);
        addQueryToHistory(sql);
      } else {
        currentResult = null;
        showAffectedRows(result);
        addQueryToHistory(sql);
      }
    } catch(err) {
      showError(err.message || String(err));
    }
    btn.classList.remove('running');
    btn.innerHTML = '&#9654; Run';
  }, 50);
}

function showAffectedRows(count) {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('resultsInfo').style.display = 'none';
  document.getElementById('resultsGrid').style.display = 'none';
  document.getElementById('emptyState').innerHTML = '<div class="es-icon">&#9989;</div><div class="es-title">Query Executed</div><div class="es-desc">Affected rows: <b>' + count + '</b></div>';
}

function showScalarResult(data) {
  if (!data || data.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('emptyState').innerHTML = '<div class="es-icon">&#128270;</div><div class="es-title">No Results</div><div class="es-desc">The query executed successfully but returned 0 rows.</div>';
    document.getElementById('resultsInfo').style.display = 'none';
    document.getElementById('resultsGrid').style.display = 'none';
    return;
  }
  // Convert scalar array into objects
  var converted = data.map(function(v, i) {
    var o = {};
    o['result'] = v;
    return o;
  });
  currentResult = converted;
  sortCol = null;
  sortDir = 'asc';
  selectedRow = null;
  renderResult(converted);
}

function showError(msg) {
  document.getElementById('errorBar').classList.add('show');
  document.getElementById('errorText').textContent = msg;
}

function hideError() {
  document.getElementById('errorBar').classList.remove('show');
}

// ============================================================
// RENDER RESULTS (with row selection)
// ============================================================
function renderResult(data) {
  var empty = document.getElementById('emptyState');
  var info = document.getElementById('resultsInfo');
  var grid = document.getElementById('resultsGrid');

  if (!data || data.length === 0) {
    empty.style.display = 'flex';
    empty.innerHTML = '<div class="es-icon">&#128270;</div><div class="es-title">No Results</div><div class="es-desc">The query executed successfully but returned 0 rows.</div>';
    info.style.display = 'none';
    grid.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  info.style.display = 'flex';
  grid.style.display = 'block';

  var headers = Object.keys(data[0]);
  document.getElementById('rowCount').textContent = data.length;
  document.getElementById('colCount').textContent = headers.length;
  document.getElementById('sortInfo').textContent = sortCol ? ('Sorted by: ' + sortCol + ' (' + (sortDir === 'asc' ? 'ASC' : 'DESC') + ')') : '';

  var tableHtml = '<table class="results-table" id="resultsTable"><colgroup>';
  tableHtml += '<col style="width:40px">';

  for (var ci = 0; ci < headers.length; ci++) {
    var maxW = headers[ci].length * 9 + 30;
    var sampleCount = Math.min(data.length, 50);
    for (var ri = 0; ri < sampleCount; ri++) {
      var val = data[ri][headers[ci]];
      var displayVal;
      if (val === null || val === undefined) {
        displayVal = 'NULL';
      } else if (typeof val === 'number') {
        displayVal = Number.isInteger(val) ? val.toLocaleString() : val.toFixed(2);
      } else {
        displayVal = String(val);
      }
      maxW = Math.max(maxW, displayVal.length * 8 + 24);
    }
    tableHtml += '<col style="width:' + Math.min(Math.max(60, maxW), 350) + 'px" data-col-idx="' + ci + '">';
  }

  tableHtml += '</colgroup><thead><tr>';
  tableHtml += '<th style="width:40px;text-align:center;cursor:default">#</th>';

  for (var hi = 0; hi < headers.length; hi++) {
    var h = headers[hi];
    var safeH = h.replace(/'/g, "\\'");
    var sortedClass = (sortCol === h) ? ' class="sorted"' : '';
    var sortArrow = '';
    if (sortCol === h) {
      sortArrow = sortDir === 'asc' ? ' &#9650;' : ' &#9660;';
    }
    tableHtml += '<th data-col="' + hi + '" draggable="true"' + sortedClass + '>';
    tableHtml += '<div class="th-content" onclick="sortByColumn(\'' + safeH + '\')">' + h + '<span class="sort-icon" id="sort_' + h + '">' + sortArrow + '</span></div>';
    tableHtml += '<div class="col-resize-handle"></div>';
    tableHtml += '</th>';
  }

  tableHtml += '</tr></thead><tbody>';

  for (var rowIdx = 0; rowIdx < data.length; rowIdx++) {
    tableHtml += '<tr onclick="toggleRowSelection(this)" data-row-idx="' + rowIdx + '">';
    tableHtml += '<td style="color:var(--text-muted);text-align:center;font-size:10px">' + (rowIdx + 1) + '</td>';
    for (var colIdx = 0; colIdx < headers.length; colIdx++) {
      var cellVal = data[rowIdx][headers[colIdx]];
      var cls = '';
      var displayValue;
      if (cellVal === null || cellVal === undefined) {
        displayValue = 'NULL';
        cls = 'null-val';
      } else if (typeof cellVal === 'number') {
        cls = 'number-val';
        displayValue = Number.isInteger(cellVal) ? cellVal.toLocaleString() : cellVal.toFixed(2);
      } else {
        displayValue = String(cellVal);
      }
      var rawVal = (data[rowIdx][headers[colIdx]] === null || data[rowIdx][headers[colIdx]] === undefined) ? 'NULL' : String(data[rowIdx][headers[colIdx]]);
      tableHtml += '<td class="' + cls + '" title="' + rawVal.replace(/"/g, '&quot;') + '">' + displayValue + '</td>';
    }
    tableHtml += '</tr>';
  }

  tableHtml += '</tbody></table>';
  grid.innerHTML = tableHtml;

  // Attach column resize and drag listeners
  initColumnResize();
  initColumnDragDrop();
  initRowSelection();
}

// ============================================================
// ROW SELECTION
// ============================================================
function initRowSelection() {
  var table = document.getElementById('resultsTable');
  if (!table) return;
  var tbody = table.querySelector('tbody');
  if (!tbody) return;
}

function toggleRowSelection(tr) {
  // Check if this row is already selected
  if (tr.classList.contains('row-selected')) {
    tr.classList.remove('row-selected');
    selectedRow = null;
  } else {
    // Deselect previously selected row
    var prev = document.querySelector('.results-table tr.row-selected');
    if (prev) prev.classList.remove('row-selected');
    // Select this row
    tr.classList.add('row-selected');
    selectedRow = tr.getAttribute('data-row-idx');
  }
}

// ============================================================
// COLUMN RESIZE
// ============================================================
function initColumnResize() {
  var table = document.getElementById('resultsTable');
  if (!table) return;

  var handles = table.querySelectorAll('.col-resize-handle');
  for (var i = 0; i < handles.length; i++) {
    (function(handle) {
      var th = handle.parentElement;
      if (!th || !th.getAttribute('data-col')) return;
      var colIdx = parseInt(th.getAttribute('data-col'), 10);
      var colgroup = table.querySelector('colgroup');
      if (!colgroup) return;
      // colIdx is 0-based for data columns, colgroup has row# col at index 0
      var col = colgroup.children[colIdx + 1];
      if (!col) return;

      handle.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        var startX = e.clientX;
        var startW = col.offsetWidth;
        handle.classList.add('active');

        function onMove(ev) {
          var delta = ev.clientX - startX;
          var newW = Math.max(60, startW + delta);
          col.style.width = newW + 'px';
        }

        function onUp() {
          handle.classList.remove('active');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })(handles[i]);
  }
}

// ============================================================
// COLUMN DRAG & DROP REORDER
// ============================================================
var dragState = null;

function initColumnDragDrop() {
  var table = document.getElementById('resultsTable');
  if (!table) return;

  var ths = table.querySelectorAll('thead th[data-col]');
  for (var i = 0; i < ths.length; i++) {
    (function(th) {
      th.addEventListener('dragstart', function(e) {
        var colIdx = parseInt(this.getAttribute('data-col'), 10);
        dragState = { fromIdx: colIdx, th: this };
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(colIdx));
      });

      th.addEventListener('dragend', function() {
        this.classList.remove('dragging');
        var allThs = document.querySelectorAll('.results-table th');
        for (var j = 0; j < allThs.length; j++) {
          allThs[j].classList.remove('drag-over-left', 'drag-over-right');
        }
        dragState = null;
      });

      th.addEventListener('dragover', function(e) {
        if (!dragState) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var toIdx = parseInt(this.getAttribute('data-col'), 10);
        if (toIdx === dragState.fromIdx) return;
        // Clean up all indicator classes
        var allThs = document.querySelectorAll('.results-table th');
        for (var j = 0; j < allThs.length; j++) {
          allThs[j].classList.remove('drag-over-left', 'drag-over-right');
        }
        var rect = this.getBoundingClientRect();
        var midX = rect.left + rect.width / 2;
        if (e.clientX < midX) {
          this.classList.add('drag-over-left');
        } else {
          this.classList.add('drag-over-right');
        }
      });

      th.addEventListener('dragleave', function() {
        this.classList.remove('drag-over-left', 'drag-over-right');
      });

      th.addEventListener('drop', function(e) {
        e.preventDefault();
        if (!dragState) return;
        var toIdx = parseInt(this.getAttribute('data-col'), 10);
        if (toIdx === dragState.fromIdx) { dragState = null; return; }
        var rect = this.getBoundingClientRect();
        var midX = rect.left + rect.width / 2;
        var insertBefore = (e.clientX < midX);
        reorderColumns(dragState.fromIdx, toIdx, insertBefore);
        dragState = null;
      });
    })(ths[i]);
  }
}

function reorderColumns(fromIdx, toIdx, insertBefore) {
  if (!currentResult || currentResult.length === 0) return;
  var origKeys = Object.keys(currentResult[0]);
  var movedKey = origKeys.splice(fromIdx, 1)[0];
  var insertAt = toIdx > fromIdx ? toIdx - 1 : toIdx;
  if (!insertBefore) insertAt++;
  origKeys.splice(insertAt, 0, movedKey);

  var newData = [];
  for (var i = 0; i < currentResult.length; i++) {
    var row = currentResult[i];
    var newRow = {};
    for (var k = 0; k < origKeys.length; k++) {
      newRow[origKeys[k]] = row[origKeys[k]];
    }
    newData.push(newRow);
  }
  currentResult = newData;
  renderResult(currentResult);
}

// ============================================================
// SORT
// ============================================================
function sortByColumn(col) {
  if (!currentResult || currentResult.length === 0) return;
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }

  currentResult.sort(function(a, b) {
    var va = a[col];
    var vb = b[col];
    if (va === null || va === undefined) va = sortDir === 'asc' ? Infinity : -Infinity;
    if (vb === null || vb === undefined) vb = sortDir === 'asc' ? Infinity : -Infinity;
    if (typeof va === 'number' && typeof vb === 'number') {
      return sortDir === 'asc' ? va - vb : vb - va;
    }
    va = String(va);
    vb = String(vb);
    return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  // Re-render without changing currentResult reference for sort state
  renderResult(currentResult);
}

// ============================================================
// TOOLBAR ACTIONS
// ============================================================
function clearEditor() {
  editor.value = '';
  updateLineNumbers();
  updateHighlight();
  hideError();
  currentResult = null;
  sortCol = null;
  sortDir = 'asc';
  selectedRow = null;
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('emptyState').innerHTML = '<div class="es-icon">&#128450;</div><div class="es-title">No Results Yet</div><div class="es-desc">Write a SQL query above and click <b>Run</b> or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd>.<br>Select a sample query from the sidebar to get started.</div>';
  document.getElementById('resultsInfo').style.display = 'none';
  document.getElementById('resultsGrid').style.display = 'none';
  document.getElementById('execTime').textContent = '';
  editor.focus();
}

function formatQuery() {
  var sql = editor.value.trim();
  var keywords = [
    'SELECT','FROM','WHERE','JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN',
    'FULL OUTER JOIN','INNER JOIN','ON','AND','OR','GROUP BY','ORDER BY',
    'HAVING','LIMIT','AS','DISTINCT','UNION','INSERT','UPDATE','DELETE',
    'SET','INTO','VALUES','CREATE','DROP','TABLE','NOT','IN','BETWEEN',
    'LIKE','IS NULL','IS NOT NULL','ASC','DESC','COUNT','SUM','AVG','MIN','MAX','ROUND'
  ];
  // Sort by length descending to match longer keywords first
  keywords.sort(function(a, b) { return b.length - a.length; });
  for (var i = 0; i < keywords.length; i++) {
    var kw = keywords[i];
    var regex = new RegExp('\\b' + kw.replace(/ /g, '\\s+') + '\\b', 'gi');
    sql = sql.replace(regex, '\n' + kw);
  }
  sql = sql.replace(/\n\n+/g, '\n').trim();
  sql = sql.replace(/^(\s*)(ON|AND|OR)/gm, '  $1$2');
  editor.value = sql;
  updateLineNumbers();
  updateHighlight();
}

// ============================================================
// SIDEBAR RESIZER
// ============================================================
(function() {
  var resizer = document.getElementById('sidebarResizer');
  var sidebar = document.getElementById('sidebar');
  var startX, startW;

  resizer.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    resizer.classList.add('active');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });

  function onMove(e) {
    var delta = e.clientX - startX;
    var newW = Math.max(150, Math.min(500, startW + delta));
    sidebar.style.width = newW + 'px';
  }

  function onUp() {
    resizer.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
})();

// ============================================================
// RESIZER (editor/results split)
// ============================================================
(function() {
  var resizer = document.getElementById('resizer');
  var editorWrap = document.getElementById('editorWrap');
  var startY, startH;

  resizer.addEventListener('mousedown', function(e) {
    startY = e.clientY;
    startH = editorWrap.offsetHeight;
    resizer.classList.add('active');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });

  function onMove(e) {
    var delta = e.clientY - startY;
    var newH = Math.max(100, startH + delta);
    var maxH = editorWrap.parentElement.offsetHeight - 150;
    editorWrap.style.height = Math.min(newH, maxH) + 'px';
  }

  function onUp() {
    resizer.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
})();

// ============================================================

initFontSize();
initDB();
buildSidebar();
renderSavedQueries();
updateLineNumbers();
updateHighlight();
